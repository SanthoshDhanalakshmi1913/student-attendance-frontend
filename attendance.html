<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mark Attendance</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="container">

    <div class="top-nav">

        <a href="index.html">🏠 Home</a>

        <a href="register.html">Register Student</a>

        <a href="records.html">Records</a>

    </div>


    <div class="header">

        <h1>Mark Attendance</h1>

        <p>Student Daily IN / OUT Time</p>

    </div>


    <div class="card">

        <form id="attendanceForm">

            <div class="form-group">

                <label>Student ID</label>

                <input
                    type="text"
                    id="attendanceStudentId"
                    placeholder="Example: PUMO2026IT01"
                    required
                >

            </div>


            <div class="form-group">

                <label>Student Name</label>

                <input
                    type="text"
                    id="attendanceStudentName"
                    placeholder="Auto Fetch Student Name"
                    readonly
                >

            </div>


            <button
                type="submit"
                class="attendance-btn"
            >
                Mark IN / OUT
            </button>

        </form>


        <p
            id="attendanceMessage"
            class="message"
        ></p>

    </div>

</div>


<script src="js/config.js"></script>

<script src="js/attendance.js"></script>

</body>

</html>
